<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clover Infotech Chat</title>

    <style>
      :root {
        --primary: #2563eb;
        --bg: #f4f6fb;
        --user: #2563eb;
        --bot: #e5e7eb;
      }

      * {
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        background: var(--bg);
        height: 100vh;
        display: flex;
      }

      .chat-container {
        display: flex;
        flex-direction: column;
        width: 100%;
        max-width: 100%;
        height: 100vh;
        background: #fff;
      }

      .chat-header {
        padding: 20px;
        background: var(--primary);
        color: #fff;
        font-size: 14px;
        font-weight: 400;
        background-color: transparent;
    background-image: linear-gradient(89deg, #21D4FD 0%, #B721FF 88%);
    box-shadow: 5px 10px 40px #00000085;
    display: flex;
    justify-content: space-between;
    align-items: center;
      }

      .chat-body {
        flex: 1;
        padding: 16px;
        overflow-y: auto;
      }

      .message {
        max-width: 70%;
        padding: 12px 14px;
        border-radius: 12px;
        margin-bottom: 12px;
        line-height: 1.4;
      }

      .user {
        background: var(--user);
        color: #fff;
        margin-left: auto;
        border-bottom-right-radius: 4px;
      }

      .bot {
        background: var(--bot);
        color: #111;
        margin-right: auto;
        border-bottom-left-radius: 4px;
      }

      .chat-footer {
        display: flex;
        padding: 12px;
        border-top: 1px solid #ddd;
      }

      .chat-footer input {
        flex: 1;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #ccc;
        outline: none;
      }

      .chat-footer button {
        margin-left: 10px;
        padding: 12px 18px;
        border-radius: 8px;
        border: none;
        background: var(--primary);
        color: #fff;
        cursor: pointer;
      }

      .chat-footer button:hover {
        opacity: 0.9;
      }

      .loader {
        font-size: 14px;
        opacity: 0.6;
      }
      .chatboattext{font-size: 18px;}
      
    </style>
  </head>

  <body>
    <div class="chat-container">
      <div class="chat-header"> 
        <img src="https://www.cloverinfotech.com/wp-content/uploads/2020/03/Logo.png" alt="" width="160" />
        <div class="chatboattext">Clover AI Chatbot</div>
        <div>Developed for Canara HSBC</div>
      </div>

      <div class="chat-body" id="chatBody">
        <div class="message bot">👋 Hello! How can I help you today?</div>
      </div>

      <div class="chat-footer">
        <input type="text" id="userInput" placeholder="Type your message..." />
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>

    <script>
      const webhookUrl = "https://raisn8n.app.n8n.cloud/webhook/bgic";
      const chatBody = document.getElementById("chatBody");
      const userInput = document.getElementById("userInput");

      function addMessage(text, sender) {
        const msg = document.createElement("div");
        msg.className = `message ${sender}`;
        msg.innerText = text;
        chatBody.appendChild(msg);
        chatBody.scrollTop = chatBody.scrollHeight;
      }

      async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        addMessage(text, "user");
        userInput.value = "";

        const loader = document.createElement("div");
        loader.className = "message bot loader";
        loader.innerText = "Typing...";
        chatBody.appendChild(loader);
        chatBody.scrollTop = chatBody.scrollHeight;

        try {
          const res = await fetch(webhookUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              message: text,
            }),
          });

          const data = await res.json();
          console.log("RAW RESPONSE:", data);

          let botReply = "No response received";

          // Case 1: Proper reply field
          if (typeof data.reply === "string") {
            botReply = data.reply;
          }

          // Case 2: Direct output
          else if (typeof data.output === "string") {
            botReply = data.output;
          }

          // Case 3: Nested object (AI Agent / RAG output)
          else if (typeof data === "object") {
            const firstValue = Object.values(data)[0];
            if (firstValue?.output) {
              botReply = firstValue.output;
            }
          }

          /* ✅ FIX STARTS HERE */
          loader.remove(); // ← VERY IMPORTANT
          addMessage(botReply, "bot"); // ← THIS WAS MISSING
          /* ✅ FIX ENDS HERE */
        } catch (err) {
          loader.remove();
          addMessage("⚠️ Server error. Please try again.", "bot");
        }
      }

      userInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") sendMessage();
      });
    </script>
  </body>
</html>
